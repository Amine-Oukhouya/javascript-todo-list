<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="style.css">
    
<link rel="icon" type="image/png" href="icon.png">

</head>
<body>
    <div class="main-container">
        <div class="big-title">
            <h1>To Do List</h1>
        </div>
        <div class="inputtask">
            <input type="text" name="task" id="task-input" class="inputtext" placeholder="Your task Here" required>
            <button type="submit" id="submitBtn">Add</button>
        </div>
        <div class="numberofTasks">
            <h3 id="tasknum">The number of tasks is: 0</h3>
        </div>
        <div class="tasks" id="tasksList">
            <div class="task">
                <h2 class="tasktitle">Mock Task ...</h2>
                <div class="btns">
                <span id="deleteBtn" class="delete">Delete</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
